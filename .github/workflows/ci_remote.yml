name: CI Remote

on:
  workflow_dispatch:
  schedule:
    # Once a month
    - cron: '0 8 18 * *'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout zap-extensions
      checks: write # Publish JUnit report
    outputs:
      extensions_ref: ${{ steps.checkout.outputs.commit }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        id: checkout
        with:
          repository: zaproxy/zap-extensions
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-home-cache-includes: |
            caches
            notifications
      - run: ./gradlew -Dorg.gradle.jvmargs=-Xmx4g --continue --no-parallel test
        env:
          ZAP_REMOTE_TESTS: 1
      - name: Publish JUnit report
        if: always()
        uses: step-security/action-junit-report@6c33c83bbe7511864f70174ba8275e4ea1174e21 # v6.4.0
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true

  report-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      issues: write # Open issue for failed CI Remote run
    steps:
      - name: Open issue for failed CI Remote run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXTENSIONS_REF: ${{ needs.build.outputs.extensions_ref }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const extensionsRef = process.env.EXTENSIONS_REF;
            const extensionsUrl = `https://github.com/zaproxy/zap-extensions/commit/${extensionsRef}`;
            const title = `CI Remote failed (${context.workflow} #${context.runNumber})`;
            const body = [
              'The CI Remote workflow run failed.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- zap-extensions: ${extensionsUrl}`,
              '',
              'Check the workflow run for test failures and logs.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
